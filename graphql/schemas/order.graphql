enum OrderStatus {
  CREATED
  ACCEPTED_BY_SALON
  PICKUP_ASSIGNED
  PICKED_UP
  AT_SALON
  REVAMPING
  READY_FOR_DELIVERY
  OUT_FOR_DELIVERY
  DELIVERED
  CANCELLED
}

enum OrderItemType {
  SERVICE
  PRODUCT
}

enum StatusActor {
  SYSTEM
  SALON
  RIDER
}

type Address {
  id: ID
  userId: String
  label: String
  address: String!
  latitude: Float!
  longitude: Float!
  isDefault: Boolean!
  createdAt: DateTime
}

type OrderItem {
  id: ID!
  orderId: String!
  itemType: OrderItemType!
  referenceId: String!
  serviceId: String
  nameSnapshot: String!
  priceSnapshot: Float!
  quantity: Int!
  hairType: String
  hairLength: String
  createdAt: DateTime!
  service: Service
  notes: String
  orderItemUrl: String
}

type Service {
  id: ID!
  name: String!
  description: String
  basePrice: Float!
  estimatedDays: Int!
  category: String!
  isActive: Boolean!
  createdAt: DateTime!
  isPopular: Boolean!
  isBestValue: Boolean!
}

type OrderStatusEvent {
  id: ID!
  orderId: String!
  status: OrderStatus!
  message: String
  actor: StatusActor!
  createdAt: DateTime!
}

type Order {
  id: ID!
  customerId: String!
  salonId: String
  pickupAddressId: String!
  phoneNumber: String
  status: OrderStatus!
  totalAmount: Float!
  requestedReturnDate: DateTime
  requestedReturnDays: Int
  createdAt: DateTime!
  updatedAt: DateTime!
  customer: User!
  salon: Salon
  pickupAddress: Address!
  items: [OrderItem!]!
  statusEvents: [OrderStatusEvent!]!
  payments: [Payment!]!
}

type Salon {
  id: ID!
  userId: String!
  name: String!
  address: String!
  latitude: Float!
  longitude: Float!
  serviceRadiusKm: Int!
  rating: Float
  isVerified: Boolean!
  imageUrl: String
  isOnline: Boolean!
  onboardingComplete: Boolean!
  createdAt: DateTime!
}

type Payment {
  id: ID!
  orderId: String!
  customerId: String!
  provider: String!
  reference: String!
  amount: Float!
  status: String!
  paidAt: DateTime
  createdAt: DateTime!
}

input HairItemInput {
  serviceId: ID!
  description: String
  notes: String
  hairType: String!
  hairLength: String!
  orderItemUrl: String
}

input PickupAddressInput {
  address: String!
  latitude: Float!
  longitude: Float!
  label: String
}

input CreateRevampOrderInput {
  salonId: ID!
  pickupAddress: PickupAddressInput!
  phoneNumber: String
  hairItems: [HairItemInput!]!
  notes: String
  requestedReturnDate: DateTime
  requestedReturnDays: Int
}

type CreateRevampOrderPayload {
  order: Order!
}

input UpdateOrderStatusInput {
  orderId: ID!
  status: OrderStatus!
  actor: StatusActor!
  message: String
}

type UpdateOrderStatusPayload {
  order: Order!
}

input RecentOrdersInput {
  cursor: String
  limit: Int
}

input SalonOrdersInput {
  cursor: String
  limit: Int
  salonId: ID
}

type RecentOrdersConnection {
  orders: [Order!]!
  hasNextPage: Boolean!
  endCursor: String
}

extend type Query {
  services: [Service!]!
  recentOrdersInProgress(input: RecentOrdersInput): RecentOrdersConnection!
  orderHistory(input: RecentOrdersInput): RecentOrdersConnection!
  order(id: ID!): Order!
  salonCreatedOrders(input: SalonOrdersInput): RecentOrdersConnection!
  salonOrders(input: SalonOrdersInput): RecentOrdersConnection!
}

extend type Mutation {
  createRevampOrder(input: CreateRevampOrderInput!): CreateRevampOrderPayload!
  updateOrderStatus(input: UpdateOrderStatusInput!): UpdateOrderStatusPayload!
}

query Services {
  services {
    id
    name
    description
    basePrice
    estimatedDays
    category
    isActive
    createdAt
    isPopular
    isBestValue
  }
}

query RecentOrdersInProgress($input: RecentOrdersInput) {
  recentOrdersInProgress(input: $input) {
    orders {
      id
      customerId
      salonId
      pickupAddressId
      status
      totalAmount
      createdAt
      updatedAt
      items {
        id
        nameSnapshot
        priceSnapshot
        quantity
        hairType
        hairLength
        service {
          id
          name
          description
          basePrice
          estimatedDays
          category
          isActive
        }
        notes
        orderItemUrl
      }
    }
    hasNextPage
  }
}

query OrderHistory($input: RecentOrdersInput) {
  orderHistory(input: $input) {
    orders {
      id
      customerId
      salonId
      pickupAddressId
      status
      totalAmount
      createdAt
      updatedAt
      items {
        id
        nameSnapshot
        priceSnapshot
        quantity
        hairType
        hairLength
        service {
          id
          name
          description
          basePrice
          estimatedDays
          category
          isActive
        }
        notes
        orderItemUrl
      }
    }
    hasNextPage
    endCursor
  }
}

query SalonCreatedOrders($input: SalonOrdersInput) {
  salonCreatedOrders(input: $input) {
    orders {
      id
      customerId
      salonId
      pickupAddressId
      status
      totalAmount
      createdAt
      updatedAt
      items {
        id
      }
      statusEvents {
        id
        orderId
        status
        message
        actor
        createdAt
      }
      payments {
        id
        orderId
        customerId
        provider
        reference
        amount
        status
      }
      customer {
        id
        fullName
        email
        role
        profileImage
        authProvider
        providerId
      }
      salon {
        id
        name
        address
        latitude
        longitude
        serviceRadiusKm
      }
      pickupAddress {
        id
        userId
        label
        address
        latitude
        longitude
        isDefault
      }
      items {
        id
        nameSnapshot
        priceSnapshot
        quantity
        hairType
        hairLength
        notes
        orderItemUrl
      }
    }
    hasNextPage
    endCursor
  }
}

query SalonOrders($input: SalonOrdersInput) {
  salonOrders(input: $input) {
    orders {
      id
      customerId
      salonId
      pickupAddressId
      pickupAddress {
        id
        userId
        label
        address
        latitude
        longitude
        isDefault
      }
      status
      totalAmount
      createdAt
      updatedAt
      items {
        id
      }
    }
    hasNextPage
    endCursor
  }
}

